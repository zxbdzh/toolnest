name: Windows checks
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Format, vet and test without windows
        shell: pwsh
        env:
          GOMAXPROCS: '2'
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOFLAGS: -mod=readonly
        run: |
          $ErrorActionPreference = 'Stop'
          $go = (Get-Command go.exe).Source
          ./scripts/build.ps1 -Task format -Go $go
          ./scripts/build.ps1 -Task vet -Go $go
          ./scripts/build.ps1 -Task test -Go $go
          if ($LASTEXITCODE) { throw 'Windows checks failed.' }
